name: GT FMS Automation

on:
  schedule:
    # GitHub starts scheduled runs late (observed 3-6 h), so the times below are the
    # EARLIEST start. Two runs a day keep Full Flow within ~a day of Vinculum:
    - cron: '30 19 * * *'   # nightly, 01:00 IST (really ~04:00-07:00 IST)
    - cron: '47 12 * * *'   # evening, 18:17 IST: picks up the day's Vinculum files
                            # (Pick Pack / Sales / Order Enquiry land ~15:30-17:00 IST)
                            # the same day instead of the next morning. 2026-10-13.
  workflow_dispatch:          # keeps the manual "Run workflow" button too
    inputs:
      backfill_mode:
        description: >-
          write = normal nightly run. dry-run = Full Flow script logs what it would
          fill / refresh / append and writes NOTHING (POD + planned-status steps are
          skipped too). off = no fill/refresh, new rows still appended.
        required: false
        default: 'write'
        type: choice
        options: ['dry-run', 'write', 'off']
      sales_lookback_days:
        description: >-
          Days of daily Sales Report files (DD.MM.YYYY) to read directly (default 7).
          Raise for a catch-up after a Vinculum outage, e.g. 12 on 23-Oct reads 11.10 onward.
        required: false
        default: '7'

# Never two Full Flow runs at once (evening + nightly, or a manual run): both would
# append / fill from the same read. A second run waits; it is not cancelled.
concurrency:
  group: fms-full-flow
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Scheduled runs have no inputs -> write.
      BACKFILL_MODE: ${{ github.event.inputs.backfill_mode || 'write' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        id: install
        run: pip install -r requirements.txt pytest==9.1.1

      # Offline tests (no Google access). If they fail, the Full Flow step is skipped
      # (it would write with broken matching); POD + planned status still run.
      - name: Run tests
        id: tests
        run: python -m pytest tests -q

      - name: Run Full Flow FMS script
        id: fullflow
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          # Only this step: a job-level value leaked into "Run tests", which assume the 7-day default (23-Oct-2026).
          SALES_DAILY_LOOKBACK_DAYS: ${{ github.event.inputs.sales_lookback_days || '7' }}
        run: python scripts/gt_full_flow_fms_yes_no_all_or_latest.py

      - name: Upload Full Flow reports (suspect cancellations, unmatched rows)
        if: ${{ !cancelled() && steps.fullflow.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: fullflow-reports
          path: reports/
          if-no-files-found: ignore

      # The next two run even if an earlier step failed (a Full Flow failure must not
      # stop POD / planned-status updates); skipped only on a manual dry-run.
      - name: Run POD update script
        if: ${{ !cancelled() && steps.install.outcome == 'success' && env.BACKFILL_MODE != 'dry-run' }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python scripts/gt_full_flow_fms_pod_update_google_sheet_gt_and_order_only.py

      - name: Run planned status script
        if: ${{ !cancelled() && steps.install.outcome == 'success' && env.BACKFILL_MODE != 'dry-run' }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python scripts/gt_full_flow_fms_planned_status_google_sheet_alerts_quota_fixed_v3.py
