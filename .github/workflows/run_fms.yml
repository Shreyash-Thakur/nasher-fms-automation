name: GT FMS Automation

on:
  schedule:
    - cron: '30 19 * * *'   # daily at 1:00 AM IST (19:30 UTC)
  workflow_dispatch:          # keeps the manual "Run workflow" button too

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python scripts/gt_full_flow_fms_yes_no_all_or_latest.py
